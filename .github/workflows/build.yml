<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Manager AI V3 | Autonomous Operational Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            500: '#0066ff',
                            600: '#0052cc',
                            700: '#003d99',
                            cyan: '#00f2fe',
                            purple: '#7f56d9',
                            dark: '#0b0f17',
                            card: '#131924',
                            border: '#1f293d',
                            accent: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f17;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        .glass-panel {
            background: rgba(19, 25, 36, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(23, 32, 48, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }
        .glow-purple {
            box-shadow: 0 0 20px rgba(127, 86, 217, 0.25);
        }
        .gradient-text {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7f56d9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pulse-subtle {
            animation: pulseSubtle 2s infinite;
        }
        @keyframes pulseSubtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0f17] text-slate-100">

    <!-- Top Bar Navigation -->
    <header class="h-16 border-b border-slate-800 bg-[#0f1522]/90 backdrop-blur sticky top-0 z-40 px-4 md:px-8 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-purple-600 p-[1px] shadow-lg shadow-cyan-500/20">
                    <div class="w-full h-full bg-[#0b0f17] rounded-[11px] flex items-center justify-center">
                        <i class="fa-solid font-bold fa-brain text-cyan-400 text-lg"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-lg tracking-wider text-white">APEX<span class="text-cyan-400">.AI</span></span>
                        <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full uppercase">v3.0 Real-DB</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium hidden sm:block">Autonomous Agency Operations Console</p>
                </div>
            </div>
        </div>

        <!-- Financial Ticker Badge -->
        <div class="hidden lg:flex items-center space-x-6 px-4 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800/80 text-xs font-mono">
            <div>
                <span class="text-slate-400">Total Revenue:</span>
                <span id="tickerRevenue" class="text-emerald-400 font-bold ml-1.5">₹0 / $0</span>
            </div>
            <div class="h-4 w-[1px] bg-slate-800"></div>
            <div>
                <span class="text-slate-400">Payouts:</span>
                <span id="tickerPayouts" class="text-amber-400 font-bold ml-1.5">₹0 / $0</span>
            </div>
            <div class="h-4 w-[1px] bg-slate-800"></div>
            <div>
                <span class="text-slate-400">Net Profit:</span>
                <span id="tickerProfit" class="text-cyan-400 font-bold ml-1.5">₹0 / $0</span>
            </div>
        </div>

        <!-- Right User & System Controls -->
        <div class="flex items-center space-x-3">
            <div class="relative">
                <select id="roleSelector" onchange="switchRole(this.value)" class="bg-slate-900 text-xs text-slate-200 border border-slate-700 rounded-lg px-3 py-2 font-medium focus:outline-none focus:border-cyan-500">
                    <option value="CEO">👑 Role: CEO Command</option>
                    <option value="EDITOR">🎬 Role: Editor Workspace Mode</option>
                </select>
            </div>

            <button onclick="toggleSettingsModal()" class="px-3 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700/80 text-xs font-medium flex items-center space-x-2 transition">
                <i class="fa-solid fa-key text-cyan-400"></i>
                <span class="hidden md:inline">API Config</span>
                <span id="apiKeyStatusDot" class="w-2 h-2 rounded-full bg-rose-500"></span>
            </button>

            <button onclick="runDiagnosticsSuite()" title="Run built-in verification suite" class="px-3 py-2 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-vial-circle-check text-cyan-400"></i>
                <span class="hidden sm:inline">Run E2E Diagnostics</span>
            </button>
        </div>
    </header>

    <!-- Main Operational Workspace Container -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Sidebar Navigation -->
        <aside class="w-16 md:w-64 bg-[#0d121d] border-r border-slate-800/80 flex flex-col justify-between shrink-0">
            <div class="p-3 space-y-1">
                <div class="px-3 py-2 text-[11px] font-mono text-slate-500 font-bold uppercase tracking-wider hidden md:block">Navigation</div>
                
                <nav id="sidebarNav" class="space-y-1">
                    <button onclick="switchTab('chat')" id="nav-chat" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                        <i class="fa-solid fa-comments text-base w-5 text-center"></i>
                        <span class="hidden md:inline">AI Manager Chat</span>
                        <span id="pendingApprovalBadge" class="hidden ml-auto bg-amber-500 text-slate-950 font-extrabold text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                    </button>

                    <button onclick="switchTab('jobs')" id="nav-jobs" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
                        <i class="fa-solid fa-briefcase text-base w-5 text-center"></i>
                        <span class="hidden md:inline">Jobs Pipeline</span>
                        <span id="activeJobsCountBadge" class="ml-auto bg-slate-800 text-slate-300 text-[10px] font-mono px-2 py-0.5 rounded-full">0</span>
                    </button>

                    <button onclick="switchTab('editors')" id="nav-editors" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
                        <i class="fa-solid fa-users text-base w-5 text-center"></i>
                        <span class="hidden md:inline">Editors Roster</span>
                        <span id="editorsCountBadge" class="ml-auto bg-slate-800 text-slate-300 text-[10px] font-mono px-2 py-0.5 rounded-full">0</span>
                    </button>

                    <button onclick="switchTab('qa')" id="nav-qa" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
                        <i class="fa-solid fa-list-check text-base w-5 text-center"></i>
                        <span class="hidden md:inline">QA & Deliverables</span>
                    </button>

                    <button onclick="switchTab('financials')" id="nav-financials" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
                        <i class="fa-solid fa-chart-line text-base w-5 text-center"></i>
                        <span class="hidden md:inline">Profit & Ledger</span>
                    </button>

                    <button onclick="switchTab('activity')" id="nav-activity" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800/50 hover:text-slate-200">
                        <i class="fa-solid fa-clock-rotate-left text-base w-5 text-center"></i>
                        <span class="hidden md:inline">Activity Logs</span>
                    </button>
                </nav>
            </div>

            <div class="p-3 border-t border-slate-800/80 bg-slate-900/40 hidden md:block">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="font-mono text-[11px]">DB: IndexedDB</span>
                    </span>
                    <button onclick="exportDatabaseJSON()" class="text-slate-400 hover:text-cyan-400 text-xs" title="Export DB Backup">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Dynamic Tab Content View -->
        <main class="flex-1 bg-[#0b0f17] flex flex-col overflow-hidden relative">

            <!-- TAB 1: AI MANAGER CHAT -->
            <section id="tab-chat" class="flex-1 flex flex-col h-full overflow-hidden">
                <div class="px-6 py-3 border-b border-slate-800/80 bg-slate-900/50 flex items-center justify-between shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="relative">
                            <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400">
                                <i class="fa-solid fa-user-gear"></i>
                            </div>
                            <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 border-2 border-[#0b0f17] rounded-full"></span>
                        </div>
                        <div>
                            <h2 class="text-sm font-bold text-white flex items-center space-x-2">
                                <span>APEX Executive Manager AI</span>
                                <span class="bg-cyan-500/10 text-cyan-400 text-[10px] px-2 py-0.5 rounded border border-cyan-500/20 font-mono">Gemini-3 Flash Engine</span>
                            </h2>
                            <p class="text-xs text-slate-400">Direct CEO Private Tunnel • Persistent DB Synced</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="clearChatHistory()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 text-xs rounded-lg border border-slate-700 transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> Clear History
                        </button>
                    </div>
                </div>

                <div id="chatMessagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4"></div>

                <div class="px-4 py-2 border-t border-slate-800/60 bg-[#0d121d]/80 flex items-center space-x-2 overflow-x-auto text-xs shrink-0 no-scrollbar">
                    <span class="text-slate-500 font-mono text-[11px] uppercase shrink-0">Quick Actions:</span>
                    <button onclick="fillPrompt('Add Rahul as a video editor. He can edit Reels and charges ₹800 per project.')" class="px-2.5 py-1 bg-slate-800/90 hover:bg-cyan-950 hover:text-cyan-300 text-slate-300 rounded-lg border border-slate-700/80 shrink-0 transition">
                        <i class="fa-solid fa-user-plus text-cyan-400 mr-1"></i> Add Editor Rahul ₹800
                    </button>
                    <button onclick="fillPrompt('I found a $50 short-video editing job. Assign the best available editor.')" class="px-2.5 py-1 bg-slate-800/90 hover:bg-cyan-950 hover:text-cyan-300 text-slate-300 rounded-lg border border-slate-700/80 shrink-0 transition">
                        <i class="fa-solid fa-briefcase text-cyan-400 mr-1"></i> New $50 Job & Auto-Assign
                    </button>
                    <button onclick="fillPrompt('Show me all active jobs and editor statuses.')" class="px-2.5 py-1 bg-slate-800/90 hover:bg-cyan-950 hover:text-cyan-300 text-slate-300 rounded-lg border border-slate-700/80 shrink-0 transition">
                        <i class="fa-solid fa-list text-cyan-400 mr-1"></i> Active Jobs Status
                    </button>
                    <button onclick="fillPrompt('What is our expected profit and finance summary right now?')" class="px-2.5 py-1 bg-slate-800/90 hover:bg-cyan-950 hover:text-cyan-300 text-slate-300 rounded-lg border border-slate-700/80 shrink-0 transition">
                        <i class="fa-solid fa-calculator text-cyan-400 mr-1"></i> Expected Profit
                    </button>
                </div>

                <div class="p-4 border-t border-slate-800 bg-[#0f1522] shrink-0">
                    <form onsubmit="handleChatSubmit(event)" class="relative flex items-center">
                        <input type="text" id="chatInput" placeholder="Command AI Manager in natural language... (e.g. 'Add Rahul as editor for Reels at ₹800')" 
                               class="w-full bg-slate-900/90 text-white placeholder-slate-500 rounded-xl px-4 py-3.5 pr-28 text-sm border border-slate-700 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/50 shadow-inner">
                        <div class="absolute right-2 flex items-center space-x-1.5">
                            <button type="submit" id="sendMessageBtn" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-xs rounded-lg transition shadow-md shadow-cyan-500/20 flex items-center space-x-1.5">
                                <span>Send</span>
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- TAB 2: JOBS PIPELINE HUB -->
            <section id="tab-jobs" class="flex-1 flex flex-col p-6 overflow-y-auto hidden">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-extrabold text-white">Jobs Operational Pipeline</h2>
                        <p class="text-xs text-slate-400">Track life-cycle from client request to CEO payout approval.</p>
                    </div>
                    <button onclick="openCreateJobModal()" class="px-4 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/20 transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Create New Job</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 flex-1">
                    <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-slate-400"></span> Unassigned / Pending
                            </span>
                            <span id="colCountUnassigned" class="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                        </div>
                        <div id="colUnassigned" class="space-y-3 flex-1 overflow-y-auto"></div>
                    </div>

                    <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                            <span class="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-blue-400"></span> In Progress
                            </span>
                            <span id="colCountInProgress" class="bg-slate-800 text-blue-400 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                        </div>
                        <div id="colInProgress" class="space-y-3 flex-1 overflow-y-auto"></div>
                    </div>

                    <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-amber-400"></span> QA / CEO Approval
                            </span>
                            <span id="colCountQA" class="bg-slate-800 text-amber-400 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                        </div>
                        <div id="colQA" class="space-y-3 flex-1 overflow-y-auto"></div>
                    </div>

                    <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Completed
                     
